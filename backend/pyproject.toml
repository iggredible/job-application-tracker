[project]
name = "job-tracker-backend"
version = "0.1.0"
description = "Job application tracker API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings",
    "anthropic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "honcho",
    "httpx2>=2.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `session: Session = Depends(get_session)`.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]
